repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
      - id: ruff-format
        name: ruff format

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run ty check valentbind
        language: system
        pass_filenames: false
        types: [python]
