[project]
name = "valentBind"
version = "0.1.0"
description = "The multivalent binding model implemented in Python."
authors = [
    { name = "Aaron Meyer", email = "ameyer@ucla.edu" }
]
dependencies = [
    "numpy>=2.3",
    "scipy>=1.12",
    "jax>=0.8",
    "optimistix>=0.0.11",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ty>=0.0.74",
    "pandas>=2.2.2",
    "seaborn>=0.13.2",
    "matplotlib>=3.10",
    "ruff>=0.16.4",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["valentbind"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Unused arguments
    "ARG",
]
